stages:
  - build
  - deploy

variables:
  AWS_REGION: "ap-southeast-1"
  STACK_NAME: "TaskHubBackend"

before_script:
  - choco install awscli -y

build:
  stage: build
  script:
    - dotnet restore
    - dotnet build
    - dotnet test

deploy:
  stage: deploy
  script:
    - aws cloudformation deploy --template-file template.yaml --stack-name $STACK_NAME --capabilities CAPABILITY_IAM
  only:
    - master