stages:
  - build
  - deploy

variables:
  PROJECT_PATH: "Web API/Web API.AppHost/API.csproj"
  PUBLISH_DIR: "publish"
  ZIP_FILE: "backend.zip"

build_backend:
  stage: build
  tags:
    - backend
  script:
    - echo "Restoring project..."
    - dotnet restore "%PROJECT_PATH%"

    - echo "Publishing project..."
    - if exist "%PUBLISH_DIR%" rmdir /S /Q "%PUBLISH_DIR%"
    - dotnet publish "%PROJECT_PATH%" -c Release -o "%PUBLISH_DIR%"

    - echo "Creating ZIP..."
    - if exist "%ZIP_FILE%" del /Q "%ZIP_FILE%"
    - powershell -Command "Compress-Archive -Path '%PUBLISH_DIR%\*' -DestinationPath '%ZIP_FILE%' -Force"

  artifacts:
    paths:
      - backend.zip
    expire_in: 1 hour


deploy_backend:
  stage: deploy
  tags:
    - backend
  dependencies:
    - build_backend
  script:
    - echo "Deploying ZIP to Lambda..."
    - aws lambda update-function-code `
        --function-name "%LAMBDA_NAME%" `
        --zip-file fileb://backend.zip `
        --region "%AWS_DEFAULT_REGION%"
  only:
    - main
