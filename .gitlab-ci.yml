image: mcr.microsoft.com/dotnet/sdk:8.0

stages:
  - build
  - deploy

variables:
  DOTNET_ROOT: "/usr/share/dotnet"
  PROJECT_PATH: "Web API/Web API.AppHost/API.csproj"
  PUBLISH_DIR: "publish"

before_script:
  - apt-get update -y
  - apt-get install -y zip awscli

build_backend:
  stage: build
  tags:
    - backend
  script:
    - echo "Restoring project..."
    - dotnet restore "$PROJECT_PATH"

    - echo "Publishing project..."
    - mkdir -p $PUBLISH_DIR
    - dotnet publish "$PROJECT_PATH" -c Release -o $PUBLISH_DIR

    - echo "Creating ZIP package..."
    - cd $PUBLISH_DIR
    - zip -r backend.zip .

  artifacts:
    paths:
      - publish/backend.zip
    expire_in: 1 hour

deploy_backend:
  stage: deploy
  tags:
    - backend
  script:
    - echo "Deploying to Lambda function: $LAMBDA_NAME"
    - aws lambda update-function-code \
        --function-name "$LAMBDA_NAME" \
        --zip-file fileb://publish/backend.zip
  only:
    - main
