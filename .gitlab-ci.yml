stages:
  - build
  - deploy

variables:
  PROJECT_PATH: "Web API/Web API.AppHost/API.csproj"
  PUBLISH_DIR: "publish"

build_backend:
  stage: build
  tags:
    - backend
  script:
    - echo "Restoring project..."
    - dotnet restore "$env:PROJECT_PATH"

    - echo "Publishing project..."
    - New-Item -ItemType Directory -Force -Path $env:PUBLISH_DIR | Out-Null
    - dotnet publish "$env:PROJECT_PATH" -c Release -o $env:PUBLISH_DIR

    - echo "Creating ZIP package with Compress-Archive..."
    - Remove-Item -Path backend.zip -ErrorAction SilentlyContinue
    - Compress-Archive -Path "$env:PUBLISH_DIR\*" -DestinationPath "backend.zip" -Force

  artifacts:
    paths:
      - backend.zip
    expire_in: 1 hour

deploy_backend:
  stage: deploy
  tags:
    - backend
  script:
    - echo "Deploying ZIP to AWS Lambda function: $env:LAMBDA_NAME"
    - aws lambda update-function-code `
        --function-name "$env:LAMBDA_NAME" `
        --zip-file fileb://backend.zip
  only:
    - main
