image: mcr.microsoft.com/dotnet/sdk:8.0

stages:
  - build
  - deploy

variables:
  DOTNET_ROOT: "/usr/share/dotnet"
  PROJECT_PATH: "Web API/Web API.AppHost/API.csproj"
  PUBLISH_DIR: "publish"

before_script:
  - apt-get update
  - apt-get install -y zip awscli

build_backend:
  stage: build
  script:
    - dotnet restore "$PROJECT_PATH"
    - dotnet publish "$PROJECT_PATH" -c Release -o $PUBLISH_DIR
    - cd $PUBLISH_DIR
    - zip -r backend.zip .
  artifacts:
    paths:
      - publish/backend.zip
    expire_in: 1 hour

deploy_backend:
  stage: deploy
  script:
    - aws lambda update-function-code \
        --function-name "$LAMBDA_NAME" \
        --zip-file fileb://publish/backend.zip
  only:
    - main